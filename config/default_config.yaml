# Default configuration for OpenRoboticsInterface

# ROS 2 Settings
ros2:
  namespace: ""
  controller_name: "joint_trajectory_controller"
  action_server: "/joint_trajectory_controller/follow_joint_trajectory"

# Robot Settings
robot:
  type: "generic_6dof"
  degrees_of_freedom: 6
  planning_group: "manipulator"

# MoveIt 2 Settings
moveit:
  enabled: true
  planner: "RRTConnect"
  planning_time: 5.0
  planning_attempts: 10
  goal_tolerance: 0.01

# Joint Limits
joint_limits:
  max_velocity: 1.0  # rad/s
  max_acceleration: 2.0  # rad/s^2
  position_limits: []  # Will be populated from URDF

# GUI Settings
gui:
  window_width: 1400
  window_height: 900
  update_rate: 10  # Hz
  jog_step_default: 5.0  # degrees
